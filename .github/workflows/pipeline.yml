name: threestagepipeline
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
    - id: ver
      run: echo "version=1.2.8" >> $GITHUB_OUTPUT
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - run: echo "test waits for build run"
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps: 
    - run: echo "deploying ${{ needs.build.outputs.version }}"
